<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TechWorld | Contact</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><nav class="navbar"><a class="logo" href="index.html">Tech<span>World</span></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="gallery.html">Gallery</a></li><li><a class="active" href="contact.html">Contact</a></li></ul></nav></header>
<main class="section"><h1>Contact TechWorld</h1><p class="section-intro">A simple responsive form demonstrating styled inputs, select, textarea and button.</p>
<form class="contact" onsubmit="event.preventDefault(); alert('Thank you! Your message has been received.');">
<div class="form-row"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div></div>
<div class="field"><label for="topic">Topic</label><select id="topic" name="topic"><option>General question</option><option>Product</option><option>Website</option><option>Feedback</option></select></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" placeholder="Write your message..." required></textarea></div>
<button class="btn" type="submit">Send message</button></form></main>
<footer class="site-footer">TechWorld Student Project — Team Members: Assylbek Adilzhan</footer>
</body></html>
